# Workloads on the management cluster's banlieue: for now only the phase 2
# smoke VM. Its VMImage expects the host's image cache to be seeded
# (bootstrap/host/seed-vm-images.sh).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smoke-vm
  namespace: flux-system
spec:
  dependsOn:
    - name: hosts
    - name: vm-catalog
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./apps/smoke-vm
  prune: true
  # Ready only once the VM reports Ready: Flux becomes the smoke test's verdict.
  wait: true
