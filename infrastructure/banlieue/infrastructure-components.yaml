                            provider will reject a shrink). If absent, the class size is used.
                          format: uint32
                          maximum: 65536.0
                          minimum: 1.0
                          type: integer
                      required:
                      - name
                      - sizeGiB
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  memoryMiB:
                    description: |-
                      Override the `VMClass`'s `spec.hardware.memoryMiB`.
                      If absent, the class value is used unchanged.
                    format: uint32
                    maximum: 4194304.0
                    minimum: 128.0
                    nullable: true
                    type: integer
                type: object
              imageRef:
                description: Reference to a (cluster-scoped) VMImage.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              migrationPolicy:
                default: automatic
