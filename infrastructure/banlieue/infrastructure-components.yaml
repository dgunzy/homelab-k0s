                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                  bytesTotal:
                    description: Bytes to send, once known.
                    format: uint64
                    minimum: 0.0
                    nullable: true
                    type: integer
                  certificate:
                    description: |-
                      This host's per-move certificate, PEM. The private key never leaves
                      the host and is discarded when the move ends.
                    nullable: true
                    type: string
                  message:
                    description: Why the move failed here, for a person.
                    nullable: true
                    type: string
                  moveId:
                    description: The move this reports on; a report for another move id is stale.
                    type: string
                  phase:
                    description: Where the source host is in a move (ADR-0127 Decision 4).
                    enum:
                    - Preparing
                    - Copying
                    - Precopied
                    - Sent
                    - Resumed
                    - Failed
                    type: string
                required:
                - moveId
                - phase
                type: object
              observedGeneration:
                description: The `metadata.generation` this status was computed from.
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: The VM's last observed run state.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              sealedPartitions:
                description: |-
                  Partitions the guest has reported sealed, as LUKS containers, on a
                  first-boot sealing machine (ADR-0088, ADR-0112): from the `sealed=`
