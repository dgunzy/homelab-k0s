                  CAPI contract (optional): failure domain placement. The banlieue
                  scheduler writes the chosen failure domain here; for CAPI users the
                  parent Machine's `spec.failureDomain` is what populates this.
                nullable: true
                type: string
              firmware:
                description: Firmware. EFI / EFI Secure require the template to be EFI-capable.
                enum:
                - bios
                - efi
                - efi-secure
                type: string
              firstBootSealing:
                description: |-
                  First-boot sealing the guest must report before `GuestReady`
                  (ADR-0088), copied by `banlieue-controller` from the parent
                  `VirtualMachine`'s `VMImage.spec.firstBootSealing` when the class is
                  `tpmEnabled`. `None` for every other machine, which keeps today's
