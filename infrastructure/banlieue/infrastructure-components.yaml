    schema:
      openAPIV3Schema:
        description: |-
          VSphereMachineTemplate — a stamped-out VSphereMachine spec.

          CAPI requires an InfraMachineTemplate so higher-level controllers (a
          MachineSet / MachineDeployment) can mint many identical machines from one
          template. It wraps a single `template.spec` that is the VSphereMachine spec
          used for each generated machine. banlieue ships it for CAPI compatibility;
          standalone VirtualMachine users do not need it.
        properties:
          spec:
            description: |-
              VSphereMachineTemplate — a stamped-out VSphereMachine spec.

              CAPI requires an InfraMachineTemplate so higher-level controllers (a
              MachineSet / MachineDeployment) can mint many identical machines from one
              template. It wraps a single `template.spec` that is the VSphereMachine spec
              used for each generated machine. banlieue ships it for CAPI compatibility;
              standalone VirtualMachine users do not need it.
            properties:
              template:
                description: |-
                  The VSphereMachine spec stamped into every machine created from this
                  template.
                properties:
                  spec:
                    description: The VSphereMachine spec for machines created from this template.
                    properties:
                      cluster:
                        description: Compute cluster within the datacenter.
                        type: string
                      createdBy:
                        description: |-
                          The principal that created the parent `VirtualMachine`, copied from
                          its `banlieue.io/created-by` annotation when present (ADR-0089). That
                          annotation is stamped by an optional `MutatingAdmissionPolicy`
                          (`deploy/admission/virtualmachine-created-by.yaml`) from
                          `request.userInfo.username` at `VirtualMachine` CREATE — `None` on a
                          cluster that doesn't apply it, or for a `VirtualMachine` that
                          predates it. Surfaced as the vCenter `CreatedBy` custom attribute by
                          the provider; never a stand-in value when absent.
                        nullable: true
                        type: string
                      datacenter:
                        description: Datacenter name.
                        type: string
                      datastore:
                        description: Datastore or datastore cluster name (resolved from the storage class).
                        type: string
                      desiredPowerState:
                        default: PoweredOn
                        description: |-
                          Desired power state, resolved from the parent `VirtualMachine`'s
                          `spec.desiredPowerState` (ADR-0024). Defaults to `PoweredOn`, matching
                          `VirtualMachineSpec`'s own default.
                        enum:
                        - PoweredOn
                        - PoweredOff
                        - Suspended
                        type: string
                      disks:
                        description: |-
                          Disks. The first disk is the template's OS disk (grown if needed);
                          subsequent disks are blank.
                        items:
                          description: One virtual disk on the resulting vSphere VM.
                          properties:
                            name:
                              description: Stable disk name; echoed in status with resolved backend identifiers.
                              type: string
                            provisioning:
                              default: thin
                              description: Provisioning hint (thin / thick / eager-zeroed).
                              enum:
                              - thin
                              - thick
                              - eagerZeroed
                              type: string
                            sizeGiB:
                              description: |-
                                Disk size in GiB. For the OS disk this is a floor — the template's disk
                                is grown to at least this size.
                              format: uint32
                              maximum: 65536.0
                              minimum: 1.0
                              type: integer
                          required:
                          - name
                          - sizeGiB
                          type: object
                        maxItems: 32
                        minItems: 1
                        type: array
                      failureDomain:
                        description: |-
                          CAPI contract (optional): failure domain placement. The banlieue
                          scheduler writes the chosen failure domain here; for CAPI users the
                          parent Machine's `spec.failureDomain` is what populates this.
                        nullable: true
                        type: string
                      firmware:
                        description: Firmware. EFI / EFI Secure require the template to be EFI-capable.
                        enum:
                        - bios
                        - efi
                        - efi-secure
                        type: string
                      firstBootSealing:
                        description: |-
                          First-boot sealing the guest must report before `GuestReady`
                          (ADR-0088), copied by `banlieue-controller` from the parent
                          `VirtualMachine`'s `VMImage.spec.firstBootSealing` when the class is
                          `tpmEnabled`. `None` for every other machine, which keeps today's
                          `GuestReady` meaning unchanged.
                        nullable: true
                        properties:
                          partitions:
                            default:
                            - COS_PERSISTENT
                            description: |-
                              Kairos partition labels to seal on first boot. Defaults to
                              `[COS_PERSISTENT]`. `COS_OEM`, `COS_STATE`, `COS_RECOVERY` and
                              `COS_GRUB` are refused at admission, mirroring Kairos's own refusal.
                            items:
                              type: string
                            minItems: 1
                            type: array
                          timeoutSeconds:
                            default: 600
                            description: |-
                              Seconds from the machine's power-on (its infrastructure `Ready`
                              transition) within which the guest must report every listed partition
                              sealed; after that `GuestReady` is `False` with reason
                              `FirstBootSealingTimeout`. A clone that cannot seal halts in its
                              initramfs and never reports anything, so this is how it is noticed.
                            format: uint32
                            maximum: 86400.0
                            minimum: 60.0
                            type: integer
                        type: object
                      folder:
                        description: |-
                          Destination vCenter folder path for the **clone** (not the source
                          template — see `template_folder`). Optional; defaults to the
                          datacenter VM root, or (once set by `banlieue-controller`) the same
                          per-zone folder the template lives in.
                        nullable: true
                        type: string
                      memoryMiB:
                        description: Memory in MiB.
                        format: uint32
                        maximum: 4194304.0
                        minimum: 128.0
                        type: integer
                      network:
                        description: Network interfaces.
                        items:
                          description: One virtual network interface on the resulting vSphere VM.
                          properties:
                            ipam:
                              description: IP address management for this interface.
                              properties:
                                pool:
                                  description: Pool-based IPAM parameters.
                                  nullable: true
                                  properties:
                                    poolRef:
                                      description: |-
                                        Typed reference (apiGroup + kind + name + optional namespace).

                                        Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                        want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                        default) or future banlieue-native pool types.
                                      properties:
                                        apiGroup:
                                          type: string
                                        kind:
                                          type: string
                                        name:
                                          type: string
                                        namespace:
                                          nullable: true
                                          type: string
                                      required:
                                      - apiGroup
                                      - kind
                                      - name
                                      type: object
                                  required:
                                  - poolRef
                                  type: object
                                static:
                                  description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                                  nullable: true
                                  properties:
                                    address:
                                      type: string
                                    domain:
                                      description: |-
                                        DNS domain, used both as a DNS search domain and (by a
                                        `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                        an FQDN as `<vm-name>.<domain>`.
                                      nullable: true
                                      type: string
                                    gateway:
                                      nullable: true
                                      type: string
                                    nameservers:
                                      items:
                                        type: string
                                      type: array
                                    prefix:
                                      format: uint8
                                      maximum: 255.0
                                      minimum: 0.0
                                      type: integer
                                  required:
                                  - address
                                  - prefix
                                  type: object
                              type: object
                            macAddress:
                              description: Optional MAC address (otherwise vCenter generates one).
                              nullable: true
                              type: string
                            name:
                              description: Stable NIC name; echoed in status.
                              type: string
                            portGroup:
                              description: Resolved port group or distributed port group name.
                              type: string
                          required:
                          - ipam
                          - name
                          - portGroup
                          type: object
                        maxItems: 16
                        minItems: 1
                        type: array
                      numCpus:
                        description: Number of virtual CPUs.
                        format: uint32
                        maximum: 256.0
                        minimum: 1.0
                        type: integer
                      providerID:
                        description: |-
                          CAPI contract: Provider ID for the resulting Node, if this VM
                          becomes a Kubernetes node. Format: `vsphere://<vm-instance-uuid>`.
                          Set by the provider controller after the VM is created.
                        nullable: true
                        type: string
                      providerRef:
                        description: |-
                          Reference to the banlieue `Provider` whose connection details
                          describe the target vCenter.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      resourcePool:
                        description: |-
                          Resource pool path within the cluster. Optional; defaults to the
                          cluster's root resource pool.
                        nullable: true
                        type: string
                      template:
                        description: |-
                          vCenter template's bare display name (resolved from `VMImage`).
                          Never a decorated string (no `[dc]`/folder prefix) — see
                          `template_folder` for the scoping the lookup needs.
                        type: string
                      templateFolder:
                        description: |-
                          The per-zone vCenter folder the template in `template` lives in
                          (resolved from `VMImage.status`, e.g. `templates/cluster-01`,
                          ADR-0020 Decision #5). Set for both `Url` and `Template` vSphere
                          sources (ADR-0104); `None` only for a row written by a provider that
                          predates it, whose lookup is datacenter-wide.

                          This is deliberately a separate field from `template`, not a
                          `folder/name`-encoded string: every zone's template shares the same
                          display `name`, so a lookup that doesn't scope by folder can match
                          a *different* zone's template (found live: a datacenter-wide
                          lookup let one zone's `VirtualMachine` clone another zone's
                          template).
                        nullable: true
                        type: string
                      tpmEnabled:
                        default: false
                        description: |-
                          Attach a virtual TPM (vTPM) device to this VM, resolved from the
                          VM's `VMClass.spec.tpmEnabled` (ADR-0039). Consumed by the provider
                          controller between `clone_vm` (which always clones powered off) and
                          the power-on step, so the device exists before first boot — a hard
                          requirement for Kairos's `kcrypt` to seal LUKS keys to it during
                          unattended install.
                        type: boolean
                      userData:
                        description: |-
                          Guest bootstrap payload content — already resolved from the parent
                          `VirtualMachine`'s `spec.userData` Secret or ConfigMap (ADR-0038)
                          and placeholder-substituted (ADR-0024's `$${VM_NAME}`/`$${FQDN}`/etc.
                          set) by `banlieue-controller` (ADR-0025). The provider delivers this
                          verbatim (base64 into `guestinfo.userdata`) — it never reads a
                          Secret or ConfigMap itself.
                        nullable: true
                        type: string
                    required:
                    - cluster
                    - datacenter
                    - datastore
                    - disks
                    - firmware
                    - memoryMiB
                    - network
                    - numCpus
                    - providerRef
                    - template
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        title: VSphereMachineTemplate
        type: object
    served: true
    storage: true
