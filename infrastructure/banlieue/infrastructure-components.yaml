apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: banlieue-bootstrap
    app.kubernetes.io/name: banlieue
  name: banlieue-controller
  namespace: banlieue-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: banlieue
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/managed-by: banlieue-bootstrap
        app.kubernetes.io/name: banlieue
    spec:
      containers:
      - args:
        - controller
        - --leader-election-namespace
        - banlieue-system
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/firestoned/banlieue:v0.5.7@sha256:ace5e29849389cec63b34d2f9b18fcaf32ea49b97902c0a2fe0bab643999fccc
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
        name: controller
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: banlieue-controller
      terminationGracePeriodSeconds: 30
---
