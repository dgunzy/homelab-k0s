                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: |-
                  CAPI contract field (optional): observed failure domain.
                  Surfaced to the parent Machine's `status.failureDomain`.
                nullable: true
                type: string
              guestInstalled:
                description: |-
                  Whether the *installed* guest has announced itself, distinct from a
                  live installer still overwriting the disk (ADR-0043). Read from
                  `guestinfo.banlieue.phase` via `config.extraConfig` — the guest
                  writes it with `vmware-rpctool`, the host reads it back here. `None`
                  means nothing has looked yet (the whole life of an `Immediate` image,
                  or a `Deferred` one before its first observation); sticky at
                  `Some(true)` once observed, since the runtime value does not survive
                  a power cycle but a stopped VM has not become uninstalled. Not part
                  of the CAPI contract; mirrored onto the parent `VirtualMachine` as
                  the `GuestReady` condition (`common::condition_types::GUEST_READY`),
                  never as `Ready`.
                nullable: true
                type: boolean
              initialization:
                default: {}
                description: "CAPI contract field: replaces the deprecated v1beta1 `status.ready`."
                properties:
                  provisioned:
                    description: |-
                      True when the infrastructure provider reports that the resource's
                      infrastructure is fully provisioned.
                    nullable: true
                    type: boolean
                type: object
              installMediaDetached:
                description: |-
                  Whether the provider has made sure no install medium is left on the
                  VM (ADR-0044, vSphere amendment 2026-10-23).

                  Set once `guestInstalled` is true: every ISO-backed CD-ROM is ejected
                  (client-device backing, not connected, not connected at power-on, no
                  guest control) and this becomes `true`, also when there was nothing to
                  eject, as on an `Immediate` clone whose template's CD-ROM was removed at
                  build time. `None` until then. **Sticky once true**: an ejected ISO
                  does not come back.

                  `GuestReady` is published `True` only after this is true, so a pool can
                  never bind a member that still has its installer attached, and an
                  installed VM never keeps holding its image's ISO on the datastore.
                nullable: true
                type: boolean
              instanceUuid:
                description: |-
                  VM instance UUID. Stable across vCenter restarts and the source for
                  `spec.providerID`. Not part of the CAPI contract.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: |-
                  The backend VM's actual power state, as last observed via
                  `VirtualMachine.runtime.powerState` (ADR-0034) — the hypervisor's
                  view, available immediately on power-on, not a guest-OS-boot signal.
                  Absent until first observed. Not part of the CAPI contract; mirrored
                  onto the parent `VirtualMachine`'s own `status.observedPowerState`.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              sealedPartitions:
                description: |-
                  Partitions the guest has reported sealed, as LUKS containers, on a
                  first-boot sealing machine (ADR-0088): from ``guestinfo.banlieue.sealed``. **Sticky**:
                  the report is re-asserted every boot but lives in volatile state, and a
                  powered-off machine has not become unsealed. Empty until reported, and
                  on every machine without `spec.firstBootSealing`. Guest-supplied, so it
                  is only ever used to *withhold* `GuestReady`.
                items:
                  type: string
                type: array
              tpmAttached:
                description: |-
                  Whether a vTPM device was successfully attached, when
                  `spec.tpmEnabled` is set (ADR-0039). `None` when `tpmEnabled` is
                  `false` (nothing was ever attempted) or the attach hasn't run yet.
                  Not part of the CAPI contract; a failed attach surfaces through the
                  `Ready`/`InfrastructureReady` conditions rather than a dedicated
                  `VirtualMachine`-level mirror (ADR-0034's reasoning for
                  `observedPowerState` applies equally here).
                nullable: true
                type: boolean
              tpmEndorsementCertificates:
                description: |-
                  PEM vTPM endorsement key certificate(s) issued by vCenter for this
                  VM's vTPM (ADR-0045).

                  Read host-side from `VirtualTpm.endorsementKeyCertificate` (DER,
                  converted here) as the first guest step, so the certificate-to-VM
                  binding is recorded while the VM is still something only banlieue has
                  touched. Empty when `spec.tpmEnabled` is `false`.
                items:
                  type: string
                type: array
              vmRef:
                description: |-
                  VMware managed-object reference (vm-NNNN). Useful for operator
                  diagnostics. Not part of the CAPI contract.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: VSphereMachine
        type: object
