  namespace: k0smotron
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: k0smotron
    app.kubernetes.io/instance: manager-rolebinding
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: clusterrolebinding
    app.kubernetes.io/part-of: k0smotron
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-manager-rolebinding-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k0smotron-manager-role-bootstrap
subjects:
- kind: ServiceAccount
  name: k0smotron-controller-manager-bootstrap
  namespace: k0smotron
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: k0smotron
    app.kubernetes.io/instance: webhook-service
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: service
    app.kubernetes.io/part-of: k0smotron
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-webhook-service-bootstrap
  namespace: k0smotron
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    cluster.x-k8s.io/provider: k0sproject-k0smotron
    control-plane: controller-manager
    k0smotron-provider: bootstrap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: k0smotron
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: k0smotron
    cluster.x-k8s.io/provider: k0sproject-k0smotron
    control-plane: controller-manager
    k0smotron-provider: bootstrap
  name: k0smotron-controller-manager-bootstrap
  namespace: k0smotron
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: k0sproject-k0smotron
      control-plane: controller-manager
      k0smotron-provider: bootstrap
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        cluster.x-k8s.io/provider: k0sproject-k0smotron
        control-plane: controller-manager
        k0smotron-provider: bootstrap
    spec:
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --diagnostics-address=:8080
        - --leader-elect
        - --enable-controller=bootstrap
        - --feature-gates=${K0SMOTRON_FEATURE_GATES:=""}
        command:
        - /manager
        image: quay.io/k0sproject/k0smotron:v2.3.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: k0smotron-controller-manager-bootstrap
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: k0smotron-webhook-server-cert-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: k0smotron
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: certificate
    app.kubernetes.io/part-of: k0smotron
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-serving-cert-bootstrap
  namespace: k0smotron
spec:
  dnsNames:
  - k0smotron-webhook-service-bootstrap.k0smotron.svc
  - k0smotron-webhook-service-bootstrap.k0smotron.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: k0smotron-selfsigned-issuer-bootstrap
  secretName: k0smotron-webhook-server-cert-bootstrap
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: k0smotron
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: certificate
    app.kubernetes.io/part-of: k0smotron
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-selfsigned-issuer-bootstrap
  namespace: k0smotron
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: k0smotron/k0smotron-serving-cert-bootstrap
  labels:
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-mutating-webhook-configuration-bootstrap
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: k0smotron-webhook-service-bootstrap
      namespace: k0smotron
      path: /mutate-bootstrap-cluster-x-k8s-io-v1beta2-k0sworkerconfig
  failurePolicy: Fail
  name: mutate-k0sworkerconfig-v1beta2.k0smotron.io
  rules:
  - apiGroups:
    - bootstrap.cluster.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - k0sworkerconfigs
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: k0smotron/k0smotron-serving-cert-bootstrap
  labels:
    cluster.x-k8s.io/provider: k0sproject-k0smotron
  name: k0smotron-validating-webhook-configuration-bootstrap
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: k0smotron-webhook-service-bootstrap
      namespace: k0smotron
      path: /validate-bootstrap-cluster-x-k8s-io-v1beta2-k0sworkerconfig
  failurePolicy: Fail
  name: validate-k0sworkerconfig-v1beta2.k0smotron.io
  rules:
  - apiGroups:
    - bootstrap.cluster.x-k8s.io
    apiVersions:
    - v1beta2
    operations:
    - CREATE
    - UPDATE
    resources:
    - k0sworkerconfigs
  sideEffects: None
