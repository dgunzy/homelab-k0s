# Build the docs site (docs/, Astro Starlight under Bun) on every change, and
# deploy it to GitHub Pages from main. Pages must be set to "GitHub Actions"
# in the repository settings (Settings → Pages → Source).
name: docs

on:
  pull_request:
    paths: [docs/**, .github/workflows/docs.yaml]
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/docs.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
